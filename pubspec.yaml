name: ustametre
description: "UstaMetre - Ölç. Hesapla. Fiyatlandır."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  # Para ve ölçü hesaplarında kayan nokta hatasını önlemek için kesin
  # (arbitrary precision) ondalık aritmetik.
  decimal: ^3.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
